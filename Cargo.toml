[package]
name = "ai-content-editor-assistant"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Small JSON-driven video effects renderer for AI agents"
license = "MIT"

[[bin]]
name = "acea"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ctrlc = "3"
fs2 = "0.4"
sha2 = "0.10"
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_DirectWrite", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
